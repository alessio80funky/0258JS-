<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: sans-serif;
            margin: 24px;

        }
        .container{
            background: white;
            max-width: 480;
            margin: 0 auto;
        }
    
    </style>
    <title>売上データ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="container" class="container">
<h1 id="title"></h1>
<canvas id="Chart" width="400" height="200"></canvas>
<button id="btn">表示</button>
</div>

<script>

    const $ = id => document.getElementById(id);

    $("btn").addEventListener("click", function(){
        fetch("./data.json")
        .then(res => res.json())
        .then(json => {
            $("title").textContent = json.title || "グラフ";

            const chart = $("Chart");
            
            
            new Chart(chart, {
                type: 'bar',
                data: {
                    labels: json.labels || "not found",
                    datasets: json.datasets.map(ds => ({
                        ...ds,
                        borderWidth: 2,
                        pointRadius:3,
                         borderColor: '#FF6384',
                    }))
                },
                options:{
                    responsive: true,
                    scales:{
                        y:{beginAtZero: true}
                    }
                }
                
               });
        })
    })


</script>
    
</body>
</html>
