<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: sans-serif;
            margin: 24px;

        }
        .container{
            background: white;
            max-width: 480;
            margin: 0 auto;
        }
    
    </style>
    <title>売上データ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="container" class="container">
<h1 id="title"></h1>
<canvas id="Chart" width="400" height="200"></canvas>
<button id="btn">表示</button>
</div>

<script>

    const $ = id => document.getElementById(id);
    //色の設定
    const colors = [
        {border: '#e74c3c', background: 'rgba(231,76,60,0.15)' },
        {border: '#3498db', background:'rgba(52,152,219,0.15)'},
        {border: '#2ecc71', background: 'rgba(46,204,113,0.15)'},
        {border: '#f39c12', background: 'rgba(243,156,18,0.15)'},
    ]

    $("btn").addEventListener("click", function(){
        fetch("./data.json")
        .then(res => res.json())
        .then(json => {
            $("title").textContent = json.title || "グラフ";

            const chart = $("Chart");
            
            
            new Chart(chart, {
                type: 'radar',
                data: {
                    labels: json.labels || "not found",
                    //ds: datasetsを預ける場所　i:：インデックスを色を振り分けるための変数
                    datasets: json.datasets.map((ds, i) => ({
                        ...ds,
                        borderWidth: 4,
                        pointRadius:4,
                        //それぞれのいろをそれぞれのデータに付与するー＞特定のグラフの端っこの色
                        borderColor:colors[i % colors.length].border,
                        // //それぞれのいろをそれぞれのデータに付与するー＞特定のグラフのメイン色
                        backgroundColor:colors[i % colors.length].background,
                    }))
                },
                options:{
                    responsive: true,
                    beginAtZero: true
                }
                
               });
        })
    })


</script>
    
</body>
</html>
